name: sqflite_devtools
description: >-
  A DevTools extension that lets you browse tables, inspect schemas and run
  SQL against the sqflite databases of a running Flutter app.
version: 0.1.0
repository: https://github.com/rasyeda/sqflite_devtools
issue_tracker: https://github.com/rasyeda/sqflite_devtools/issues

environment:
  sdk: ^3.5.0

dependencies:
  sqflite_common: ^2.5.0

dev_dependencies:
  lints: ^5.0.0
  sqflite_common_ffi: ^2.3.0
  test: ^1.25.0
  vm_service: '>=14.0.0 <16.0.0'
